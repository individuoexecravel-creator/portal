# Teia do caso: Encol
caso: encol
nome: Encol
periodo:
  - 1995
  - 2026
resumo: A maior construtora do país usava o dinheiro de lançamentos novos para pagar obras antigas. Com o fim da inflação, o modelo ruiu, e a falência de 1999 deixou cerca de 42 mil compradores sem o imóvel.
desfecho: O fundador foi condenado a 4 anos e 2 meses por fraude contra a Caixa, mas a pena prescreveu; a massa falida ainda paga credores mais de 25 anos depois.
