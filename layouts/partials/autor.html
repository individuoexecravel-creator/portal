{{ with site.Params.autor }}
<aside class="autor">
  <img src="{{ "img/logo.png" | relURL }}" alt="" width="88" height="88">
  <div>
    <span class="rotulo">Quem assina</span>
    <h2>{{ .nome }}</h2>
    <p class="autor-funcao">{{ .funcao }}</p>
    <p>{{ .bio }}</p>
    {{ partial "redes.html" $ }}
  </div>
</aside>
{{ end }}
