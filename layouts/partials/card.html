<a class="card sec-{{ .Section }}" href="{{ .RelPermalink }}">
  {{ with .Params.image }}<img src="{{ (print "img/thumbs/" .) | relURL }}" alt="" loading="lazy">{{ end }}
  <span class="card-texto">
    {{ with .Params.periodo }}<span class="card-periodo">{{ . }}</span>{{ end }}
    <span class="card-titulo">{{ .Title | replaceRE ":.*$" "" }}</span>
    <span class="card-sub">{{ .Title | replaceRE "^[^:]*:?\\s*" "" }}</span>
  </span>
</a>
