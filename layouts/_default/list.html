{{ define "main" }}
<section class="wrap cabeca-lista">
  <nav class="trilha" aria-label="Você está em"><a href="{{ site.Home.RelPermalink }}">Início</a><span aria-hidden="true">›</span><a href="{{ "casos/" | relURL }}">Casos</a><span aria-hidden="true">›</span><span aria-current="page">{{ .Title }}</span></nav>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="linha">{{ . }}</p>{{ end }}
</section>
<section class="wrap">
  {{ partial "explorador.html" (dict "paginas" .RegularPages "abas" false) }}
</section>
{{ end }}
