envolvidos:
  - nome: Salvatore Cuffaro
    tipo: condenado
    rel: Presidente da Sicília; condenado em 2011 a 7 anos por favorecer a Cosa Nostra
  - nome: Marcello Dell'Utri
    tipo: condenado
    rel: Fundador da Forza Italia; condenado em 2014 a 7 anos por concurso externo em associação mafiosa
  - nome: Michele Aiello
    tipo: condenado
    rel: Empresário da saúde; condenado a 15 anos e 6 meses por associação mafiosa
  - nome: Silvio Berlusconi
    tipo: vinculo
    rel: Dell'Utri organizou seu encontro com o mafioso Stefano Bontade em 1974, segundo a Justiça
  - nome: Giovanni Falcone
    tipo: vinculo
    rel: Juiz antimáfia morto em Capaci em 1992
