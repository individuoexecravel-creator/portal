# Teia do caso: José Riva
caso: jose-riva
nome: José Riva
periodo:
  - 1995
  - 2026
resumo: Presidente da Assembleia Legislativa de Mato Grosso por vários mandatos, com cerca de 150 processos. Preso em 2015, fechou delação e contou que deputados recebiam um mensalinho para votar com o governo.
desfecho: Condenado a 26 anos pelo mensalinho, com a pena reduzida pela delação de 2020, em que se comprometeu a devolver R$ 92 milhões. Regime aberto desde 2024; ainda responde a processos.
