resumo: Deputado federal preso em 2021 por um vídeo com ameaças a ministros do STF, condenado em 2022 a 8 anos e 9 meses, perdoado por Bolsonaro e de volta à prisão quando o STF anulou o perdão.
desfecho: Condenado em 2022; graça presidencial anulada em 2023; preso desde fevereiro de 2023; semiaberto com tornozeleira em 2025.
