# Teia do caso: Silval Barbosa
caso: silval-barbosa
nome: Silval Barbosa
periodo:
  - 2010
  - 2026
resumo: Governador de Mato Grosso de 2010 a 2014, preso na Operação Sodoma em 2015, confessou numa delação homologada pelo STF em 2017 e devolveu, com a família, mais de R$ 70 milhões.
desfecho: Condenações que somam 20 anos, cumpridas em grande parte em casa; regime aberto em 2021; nova condenação no STJ em 2026, ainda com recurso.
