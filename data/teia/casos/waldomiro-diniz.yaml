# Teia do caso: Waldomiro Diniz
caso: waldomiro-diniz
nome: Waldomiro Diniz
periodo:
  - 2002
  - 2018
resumo: Assessor da Casa Civil filmado em 2002, quando presidia a Loterj, pedindo dinheiro a Carlinhos Cachoeira. O vídeo saiu em 2004 e foi o primeiro grande escândalo do governo Lula.
desfecho: Os dois condenados no Rio em 2012; em 2018, o STJ mandou prender Cachoeira e negou a prisão imediata de Waldomiro, que tinha recurso pendente.
