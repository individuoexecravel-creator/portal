# Teia do caso: Operação Dominó
caso: operacao-domino
nome: Operação Dominó
periodo:
  - 2004
  - 2025
resumo: Em 2006, a PF prendeu num só dia os presidentes da Assembleia e do Tribunal de Justiça de Rondônia por um esquema que incluía a folha paralela da Assembleia.
desfecho: Condenações em vários processos; em 2023, 17 de 21 réus escaparam pela prescrição; Carlão de Oliveira foi preso em 2025, depois de anos foragido.
