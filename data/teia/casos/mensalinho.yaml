# Teia do caso: Mensalinho
caso: mensalinho
nome: Mensalinho
periodo:
  - 2002
  - 2020
resumo: O presidente da Câmara, Severino Cavalcanti, foi acusado em 2005 de cobrar uma mesada do dono do restaurante da Casa para manter a concessão. Renunciou antes da cassação.
desfecho: Denunciado por concussão em 2007, nunca foi julgado. Eleito prefeito de João Alfredo em 2008, morreu em 2020.
novas_entidades:
  - id: severino
    nome: Severino Cavalcanti
    tipo: pessoa
    desc: Deputado do PP de Pernambuco, presidente da Câmara em 2005. Renunciou em setembro daquele ano.
  - id: sebastiao-buani
    nome: Sebastião Buani
    tipo: pessoa
    desc: Dono do restaurante Fiorella, na Câmara. Disse ter pago uma mesada a Severino.
  - id: gonzaga-patriota
    nome: Gonzaga Patriota
    tipo: pessoa
    desc: Deputado do PSB de Pernambuco. Citado por Buani na renovação do contrato; negou ter recebido dinheiro.
  - id: greenhalgh
    nome: Luiz Eduardo Greenhalgh
    tipo: pessoa
    desc: Deputado do PT, derrotado por Severino na eleição para a presidência da Câmara em 2005.
