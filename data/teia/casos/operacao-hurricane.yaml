# Teia do caso: Operação Hurricane
caso: operacao-hurricane
nome: Operação Hurricane
periodo:
  - 2007
  - 2023
resumo: Operação da PF que em 2007 prendeu desembargadores, um procurador e chefes do jogo do bicho, suspeitos de comprar e vender decisões para liberar bingos e caça-níqueis. Chegou a um ministro do STJ.
desfecho: Os chefes do jogo foram condenados em 2012. Os magistrados foram aposentados à força pelo CNJ em 2010; Medina morreu sem julgamento e Carreira Alvim foi absolvido em 2023.
