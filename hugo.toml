baseURL = "https://individuoexecravel-creator.github.io/portal/"
languageCode = "pt-br"
title = "Portal"
summaryLength = 40

[params]
  description = "Escândalos políticos contados do começo ao fim, com nomes, valores, datas e o que a Justiça decidiu."
  slogan = "Arquivo de escândalos políticos"

  # Casos indicados para quem está chegando agora (nome do arquivo, sem .md).
  # Aparecem no início, em "Para começar". Troque à vontade.
  essenciais = ["collor-pc-farias", "anoes-do-orcamento", "mensalao", "lava-jato"]

  [params.autor]
    nome = "Indivíduo Execrável"
    funcao = "Jornalista em formação, dedicado a casos políticos e criminais"
    bio = "Reconstrói cada escândalo a partir de processos judiciais, relatórios de CPIs e reportagens da época, com um compromisso: mostrar o que aconteceu, quem estava envolvido e o que a Justiça decidiu, sem esconder absolvições, prescrições ou anulações."

  # Redes sociais: cole o link de cada perfil entre as aspas.
  # Redes com o link vazio não aparecem no site.
  [[params.redes]]
    nome = "Instagram"
    url = "https://www.instagram.com/individuo_execravel/"
  [[params.redes]]
    nome = "TikTok"
    url = "https://www.tiktok.com/@indivduo.execrvel"
  [[params.redes]]
    nome = "YouTube"
    url = "https://www.youtube.com/@IndividuoExecravel"
  [[params.redes]]
    nome = "X"
    url = "https://x.com/indiv_execravel"
  [[params.redes]]
    nome = "Threads"
    url = "https://www.threads.com/@individuo_execravel"

  # Aviso no topo de todas as páginas.
  # Aparece só entre "inicio" e "fim" (horário de Brasília) e some sozinho depois.
  # Para um aviso novo: troque o "id", o texto e as datas. Para desligar: ativo = false.
  [params.aviso]
    ativo = true
    id = "tiktok-suspenso-2026-10"
    rotulo = "Aviso"
    titulo = "TikTok fora do ar"
    texto = "Nosso perfil no TikTok está suspenso até 31 de outubro. Enquanto isso, acompanhe os casos pelo Instagram, YouTube, X e Threads."
    inicio = "2026-10-28T00:00:00-03:00"
    fim = "2026-11-01T00:00:00-03:00"

[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Menu principal. A ordem segue o "weight".
# "Explorar" e "Entender" são grupos: no computador abrem uma lista; no celular viram seções do menu.
# Para pôr uma página dentro de um grupo, use parent = "explorar" ou parent = "entender".
[menus]
  [[menus.main]]
    name = "Casos"
    pageRef = "/casos"
    weight = 1
    [menus.main.params]
      icone = "casos"
  [[menus.main]]
    name = "Explorar"
    identifier = "explorar"
    weight = 2
    [menus.main.params]
      desc = "Os casos vistos de outros jeitos: no tempo, pelas pessoas, pelo dinheiro e pelas ligações."
  [[menus.main]]
    name = "Entender"
    identifier = "entender"
    weight = 3
    [menus.main.params]
      desc = "Ferramentas para entender os casos: prazos da Justiça, mapa, trilhas, comparação e glossário."
  [[menus.main]]
    name = "Sobre"
    pageRef = "/sobre"
    weight = 4
    [menus.main.params]
      icone = "ajuda"

  # Grupo Explorar
  [[menus.main]]
    name = "Linha do tempo"
    pageRef = "/linha-do-tempo"
    parent = "explorar"
    weight = 1
    [menus.main.params]
      icone = "tempo"
      desc = "Os casos ano a ano, com o presidente de cada época."
  [[menus.main]]
    name = "Pessoas"
    pageRef = "/pessoas"
    parent = "explorar"
    weight = 2
    [menus.main.params]
      icone = "pessoas"
      desc = "Quem aparece em cada caso e como terminou para cada um."
  [[menus.main]]
    name = "Quanto custou"
    pageRef = "/valores"
    parent = "explorar"
    weight = 3
    [menus.main.params]
      icone = "valores"
      desc = "Dinheiro desviado, propinas e valores devolvidos, somados."
  [[menus.main]]
    name = "Teia e globo"
    pageRef = "/teia"
    parent = "explorar"
    weight = 4
    [menus.main.params]
      icone = "teia"
      desc = "As ligações entre os casos do Brasil e o mapa dos de fora."

  # Grupo Entender
  [[menus.main]]
    name = "Tempo da Justiça"
    pageRef = "/tempo-da-justica"
    parent = "entender"
    weight = 1
    [menus.main.params]
      icone = "relogio"
      desc = "Quantos anos cada caso levou até o desfecho."
  [[menus.main]]
    name = "Mapa dos casos"
    pageRef = "/mapa"
    parent = "entender"
    weight = 2
    [menus.main.params]
      icone = "mapa"
      desc = "Os escândalos de cada estado e os federais."
  [[menus.main]]
    name = "Trilhas de leitura"
    pageRef = "/trilhas"
    parent = "entender"
    weight = 3
    [menus.main.params]
      icone = "trilha"
      desc = "Casos para ler em sequência, por tema."
  [[menus.main]]
    name = "Comparar casos"
    pageRef = "/comparar"
    parent = "entender"
    weight = 4
    [menus.main.params]
      icone = "comparar"
      desc = "Dois casos lado a lado."
  [[menus.main]]
    name = "Glossário"
    pageRef = "/glossario"
    parent = "entender"
    weight = 5
    [menus.main.params]
      icone = "livro"
      desc = "Os termos da Justiça e da política, explicados."
