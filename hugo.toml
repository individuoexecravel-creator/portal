baseURL = "https://individuoexecravel-creator.github.io/portal/"
languageCode = "pt-br"
title = "Portal"
summaryLength = 40

[params]
  description = "Os grandes escândalos políticos, contados do início ao fim."
  slogan = "Arquivo de escândalos políticos"

  [params.autor]
    nome = "Indivíduo Execrável"
    funcao = "Jornalista em formação · investigação política e criminal"
    bio = "Jornalista em formação, dedicado à investigação de casos políticos e criminais. Reconstrói cada escândalo a partir de processos judiciais, relatórios de CPIs e reportagens da época, com um compromisso: mostrar o que aconteceu, quem estava envolvido e o que a Justiça decidiu, sem esconder absolvições, prescrições ou anulações."

  # Redes sociais: cole o link de cada perfil entre as aspas.
  # Redes com o link vazio não aparecem no site.
  [[params.redes]]
    nome = "Instagram"
    url = "https://www.instagram.com/individuo_execravel/"
  [[params.redes]]
    nome = "TikTok"
    url = "https://www.tiktok.com/@indivduo.execrvel"
  [[params.redes]]
    nome = "YouTube"
    url = "https://www.youtube.com/@IndividuoExecravel"
  [[params.redes]]
    nome = "X"
    url = "https://x.com/indiv_execravel"
  [[params.redes]]
    nome = "Threads"
    url = "https://www.threads.com/@individuo_execravel"

  # Aviso no topo de todas as páginas.
  # Aparece só entre "inicio" e "fim" (horário de Brasília) e some sozinho depois.
  # Para um aviso novo: troque o "id", o texto e as datas. Para desligar: ativo = false.
  [params.aviso]
    ativo = true
    id = "pausa-eleicoes-2026"
    rotulo = "Aviso"
    titulo = "Pausa nas publicações"
    texto = "Neste sábado (24) e domingo (25) não teremos casos novos, em respeito às eleições. Voltamos na segunda-feira, 26 de outubro."
    inicio = "2026-10-24T00:00:00-03:00"
    fim = "2026-10-26T06:00:00-03:00"

[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Menu principal. A ordem segue o "weight".
[menus]
  [[menus.main]]
    name = "Casos"
    pageRef = "/casos"
    weight = 1
  [[menus.main]]
    name = "Nova República"
    pageRef = "/nova-republica"
    weight = 2
  [[menus.main]]
    name = "Internacional"
    pageRef = "/internacional"
    weight = 3
  [[menus.main]]
    name = "Teia"
    pageRef = "/teia"
    weight = 4
  [[menus.main]]
    name = "Sobre"
    pageRef = "/sobre"
    weight = 5
